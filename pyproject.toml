[project]
name = "mfuzz"
version = "0.1.0"
description = "Multi-dimensional feedback-driven DNN security testing framework"
requires-python = ">=3.13"
dependencies = [
    "torch==2.12.0.dev20260414+cu132",
    "torchvision==0.27.0.dev20260414+cu132",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "loguru>=0.7",
    "rich>=13.0",
    "matplotlib>=3.8",
    "python-docx>=1.2.0",
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'win32'"]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[[tool.uv.index]]
name = "pytorch-nightly-cu132"
url = "https://download.pytorch.org/whl/nightly/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly"
explicit = true

override-dependencies = [
    "triton>=0.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu132" }
torchvision = { index = "pytorch-nightly-cu132" }
triton = { index = "pytorch-nightly" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfuzz"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["mfuzz", "scripts", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# torch 的 __init__ 未按 pyright 期望 re-export 顶层符号（device/tensor/float32 等），
# 运行时正常，关掉这条避免对 torch 的大量误报。
reportPrivateImportUsage = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
