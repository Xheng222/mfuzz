# 消融 B：差分 + 关键神经元覆盖。本实验驱动差分与覆盖两个模块，完整列出覆盖模块的研究
# 参数；语义不参与、静态权重。机制项（lambda2_bounds、cache_dir、p_low/p_high）继承 base。
extends = "base.toml"

[run]
out = "output/diff_cov"

# 关键神经元覆盖模块（本实验驱动）
[neurons]
activation_threshold = 0.5      # t_freq，profiling 频率项激活阈值
coverage_threshold = 0.85       # t_cov，覆盖判定阈值
critical_threshold = 0.5        # τ_global，全局关键度分位阈
class_critical_threshold = 0.9  # τ_class，类关键分位阈
alpha = 0.5                     # cl 融合权重（α=1 纯频率，α=0 纯归因）
u_size = 16                     # 每轮目标神经元集合 U 的大小
lambda2 = 0.5                   # 覆盖驱动梯度

# 语义不参与
[semantic]
lambda3 = 0.0

# 静态权重
[feedback]
enabled = false
