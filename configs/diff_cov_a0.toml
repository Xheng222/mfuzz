# diff+cov 消融：α=0，纯归因关键度。与 diff_cov.toml 仅 neurons.alpha 不同，
# 用于看"去掉频率项、只看梯度归因"时关键集合可覆盖性与 CCCov 饱和的变化。

random_seed = 42
device = "cuda"

[run]
mode = "diff_cov"
out = "output/diff_cov_a0"

[dataset]
name = "mini-imagenet"
seed_size = 200
val_fraction = 0.2
batch_size = 32

[models]
names = ["resnet50", "vgg16_bn", "mobilenet_v2"]
target_idx = 0

[differential]
lambda1 = 1.0

[neurons]
activation_threshold = 0.5
critical_threshold = 0.5        # τ_global，宽
class_critical_threshold = 0.9  # τ_class，严
alpha = 0.0                     # 纯归因
u_size = 16

[semantic]
gamma_input = 0.9
theta_path = 0.0

[fuzz]
max_iterations = 100
pgd_steps = 10
step_size = 0.01
epsilon = 0.03
lambda2 = 0.5
lambda3 = 0.5
batch_size = 8
log_interval = 20

[feedback]
enabled = true
window = 10
lambda2_bounds = [0.1, 2.0]
lambda3_bounds = [0.1, 2.0]
