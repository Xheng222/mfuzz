# 消融 C：差分 + 覆盖 + 语义保持，静态权重。本实验驱动差分、覆盖、语义三个模块，完整
# 列出覆盖与语义两个模块的研究参数；动态反馈关闭。这一组同时是动态反馈的静态对照：与
# full（feedback 开）对照即第七章「静态 vs 动态」。机制项继承 base。
extends = "base.toml"

[run]
out = "output/diff_cov_sem"

# 关键神经元覆盖模块（本实验驱动）
[neurons]
activation_threshold = 0.5      # t_freq，profiling 频率项激活阈值
coverage_threshold = 0.85       # t_cov，覆盖判定阈值
critical_threshold = 0.5        # τ_global，全局关键度分位阈
class_critical_threshold = 0.9  # τ_class，类关键分位阈
alpha = 0.5                     # cl 融合权重
u_size = 16                     # 每轮目标神经元集合 U 的大小
lambda2 = 0.5                   # 覆盖驱动梯度

# 语义约束模块（本实验驱动）
[semantic]
gamma_input = 0.9               # S_input 后验过滤下界
theta_path = 0.0                # 0=关闭路径新颖与零新颖终止器（S_path 当前退化，见 base 注释）
lambda3 = 0.5                   # 语义驱动梯度

# 静态权重（λ 全程固定）
[feedback]
enabled = false
