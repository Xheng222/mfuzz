# diff+cov+sem 实验配置：差分 + 关键神经元覆盖 + 语义约束驱动（Phase 3）。
# 在 diff_cov.toml 基础上改 run.mode 为 diff_cov_sem，并启用 λ3 语义偏移权重。
# neurons 参数与 diff_cov 一致，命中同一份 profiling 缓存。
# γ_input / θ_path 经 calibrate_thresholds.py 校准后手填；未校准前用默认值。

random_seed = 42
device = "cuda"

[run]
mode = "diff_cov_sem"
out = "output/diff_cov_sem"

[dataset]
name = "mini-imagenet"       # mini-imagenet（只用 train、按类切出种子）| imagenet（train profiling、val 出种子）
seed_size = 200              # 抽多少候选种子送共识过滤（种子是 fuzzing 起点，可抽样）
val_fraction = 0.2           # mini 模式下每类留作种子池的比例，其余全部做 profiling
batch_size = 32

[models]
names = ["resnet50", "vgg16_bn", "mobilenet_v2"]
target_idx = 0

[differential]
lambda1 = 1.0

[neurons]
activation_threshold = 0.5   # t_freq，profiling 频率项激活阈值（按神经元 profiling 区间 min-max 归一化）
coverage_threshold = 0.85    # t_cov，覆盖判定阈值，与 t_freq 解耦，见实现方案第10章
critical_threshold = 0.5     # τ_global，全局 D_en 分位阈值，宽，占比约 1-τ
class_critical_threshold = 0.9  # τ_class，类关键 D_en^c 分位阈值，严，集合小而类专属
alpha = 0.5                  # cl 融合权重；α=1 纯频率，α=0 纯归因，中间为融合
u_size = 16

[semantic]
gamma_input = 0.9            # S_input 后验过滤阈值，低于此判语义失效；calibrate_thresholds.py 校准
theta_path = 0.0             # S_path 路径新颖阈值（下四分位数），校准后手填

[fuzz]
max_iterations = 100
pgd_steps = 10
step_size = 0.01
epsilon = 0.03
lambda2 = 0.5                # 覆盖目标权重
lambda3 = 0.5                # 语义偏移目标权重（obj_sem）
batch_size = 8
log_interval = 20

[feedback]
enabled = true
window = 10
lambda2_bounds = [0.1, 2.0]
lambda3_bounds = [0.1, 2.0]
