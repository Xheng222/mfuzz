# 消融 A：纯差分。只 obj_1（差分模块）驱动梯度。差分模块无逐实验参数（目标模型在
# [models].target_idx），故本文件只需关掉其余模块。覆盖、CCCov、S_input 等仍照常测量
# 并写进结果——λ 只决定是否进梯度、不决定是否被测量。harness 与引擎参数继承 base。
extends = "base.toml"

[run]
out = "output/diff"

# 覆盖不驱动
[neurons]
lambda2 = 0.0

# 语义不驱动
[semantic]
lambda3 = 0.0

# 静态权重
[feedback]
enabled = false
