# 消融 A+语义：差分 + 语义保持，不要覆盖。本实验驱动差分与语义两个模块，覆盖不进梯度
# （lambda2=0），用来和 diff_cov 对照——单独加语义 vs 单独加覆盖，各自对缺陷/覆盖/语义
# 质量的影响。静态权重。覆盖、CCCov 等仍照常测量并写进结果，lambda 只决定是否进梯度。
# 机制项（lambda3_bounds、cache_dir、p_low/p_high 等）继承 base。
extends = "base.toml"

[run]
out = "output/diff_sem"

# 覆盖不驱动（与 diff_cov 的差异就在这一行：那组 lambda2=0.5，这组 0）
[neurons]
lambda2 = 0.0

# 语义约束模块（本实验驱动）
[semantic]
gamma_input = 0.9               # S_input 后验过滤下界
theta_path = 0.0                # 0=关闭路径新颖与零新颖终止器（S_path 当前退化，见 base 注释）
lambda3 = 0.5                   # 语义驱动梯度

# 静态权重（λ 全程固定）
[feedback]
enabled = false
