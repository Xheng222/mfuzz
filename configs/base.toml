# mfuzz 默认配置。一份 TOML 完整定义一个实验。变体只需复制本文件改对应字段，
# 省略的字段回落到代码里的 dataclass 默认值。四组消融配置（Phase 6）在此基础上覆盖。
# 所有调参都走 TOML，无命令行参数覆盖。

random_seed = 42
device = "cuda"  # 无 GPU 时代码回退 cpu

[run]
mode = "diff"          # diff | diff_cov | diff_cov_sem | full（后续阶段接入）
out = "output/diff"    # 结果输出目录

[dataset]
name = "mini-imagenet"       # mini-imagenet（只用 train、按类切出种子）| imagenet（train profiling、val 出种子）
seed_size = 200              # 抽多少候选种子送共识过滤
val_fraction = 0.2           # mini 模式下每类留作种子池的比例，其余全部做 profiling
batch_size = 32

[models]
names = ["resnet50", "vgg16_bn", "mobilenet_v2"]
target_idx = 0               # 目标模型下标，其余为参考；实验阶段轮换

[differential]
lambda1 = 1.0                # obj_1 中目标模型项权重

[neurons]
activation_threshold = 0.5   # t_freq，profiling 频率项激活阈值（ĉ>t_freq 算激活），不参与覆盖判定
coverage_threshold = 0.85    # t_cov，覆盖判定阈值（ĉ>t_cov 算覆盖），与 t_freq 解耦，见实现方案第10章
p_low = 0.0                  # min-max 下分位（百分制），0=真最小值；削离群时调高如 0.5
p_high = 100.0               # min-max 上分位（百分制），100=真最大值；削离群时调低如 99.5
critical_threshold = 0.5     # τ_global，全局 D_en 分位阈值，宽，保留 cl 高于该分位的神经元（占比约 1-τ）
class_critical_threshold = 0.9  # τ_class，类关键 D_en^c 分位阈值，严，集合更小更类专属，CCCov 才拉得开
alpha = 0.5                  # cl 融合权重；α=1 纯频率，α=0 纯归因，中间为融合（消融切此一项）
u_size = 16                 # 每轮目标神经元集合 U 的大小

[semantic]
gamma_input = 0.9            # S_input 下界，低于判偏离
theta_path = 0.0            # S_path 下四分位阈值，待 calibrate 填入

[fuzz]
max_iterations = 100
pgd_steps = 10
step_size = 0.01            # η
epsilon = 0.03              # L_inf 扰动上界
lambda2 = 0.5               # 覆盖目标权重
lambda3 = 0.5               # 语义目标权重
batch_size = 8
log_interval = 20

[feedback]
enabled = true
window = 10                 # 滑动窗口轮数
lambda2_bounds = [0.1, 2.0]
lambda3_bounds = [0.1, 2.0]
