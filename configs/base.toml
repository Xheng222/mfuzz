# mfuzz 完整默认配置（base）。一份完整、可直接跑的全流水线：差分 + 关键神经元覆盖 +
# 语义保持 + 动态反馈。消融变体用 extends 继承本文件，只覆盖差异的几行旋钮，见 configs/
# 下 diff / diff_cov / diff_cov_sem / full / alpha0 / alpha1。
#
# extends 链式继承，后者覆盖前者；省略的字段回落到代码 dataclass 默认值。无 mode 字段：
# 消融行为由下面的 λ2 / λ3 / feedback.enabled 旋钮决定，不由标签。所有调参走 TOML。
#
# 校准类阈值（coverage_threshold、critical_threshold、class_critical_threshold、
# gamma_input、theta_path）跟目标模型绑定。轮换目标模型时复制本文件、改这几个值与
# target_idx，另存为 base_<model>.toml，实验层 extends 它即可切换整套标定。

random_seed = 42
device = "cuda"  # 无 GPU 时代码回退 cpu

[run]
out = "output/full"  # 输出目录

[dataset]
name = "mini-imagenet"   # mini-imagenet（只用 train、按类切种子）| imagenet（train profiling、val 出种子）
seed_size = 200          # 抽多少候选种子送共识过滤
val_fraction = 0.2       # mini 模式下每类留作种子池的比例，其余做 profiling
batch_size = 32          # profiling / 推理批大小（与 loop.seeds_per_round 区分）

[models]
names = ["resnet50", "vgg16_bn", "mobilenet_v2"]
target_idx = 0           # 目标模型下标，其余为参考；轮换目标即改此值

[neurons]
activation_threshold = 0.5      # t_freq，profiling 频率项激活阈值（不参与覆盖判定）
coverage_threshold = 0.85       # t_cov，覆盖判定阈值，与 t_freq 解耦
p_low = 0.0                     # min-max 归一化下分位（百分制），0=真最小值
p_high = 100.0                  # min-max 归一化上分位（百分制），100=真最大值
critical_threshold = 0.5        # τ_global，全局关键度分位阈，宽，占比约 1-τ
class_critical_threshold = 0.9  # τ_class，类关键分位阈，严，集合小而类专属
alpha = 0.5                     # cl 融合权重；α=1 纯频率，α=0 纯归因（α 子消融切此一项）
u_size = 16                     # 每轮目标神经元集合 U 的大小
lambda2 = 0.5                   # 覆盖目标 obj_cov 权重（消融旋钮：=0 即覆盖不进梯度）
lambda2_bounds = [0.1, 2.0]     # 动态反馈对 λ2 的夹界

[semantic]
gamma_input = 0.9        # S_input 后验过滤下界，低于此判语义失效
theta_path = 0.0         # 0=关闭路径新颖判定与零新颖终止器：S_path 在 ε=0.03 下退化（运行时余弦 0.991-0.997，校准 Q1=0.982 仍在其下，置正值只会误触发终止器）
lambda3 = 0.5            # 语义保持 obj_sem 权重（消融旋钮：=0 即语义不进梯度）
lambda3_bounds = [0.1, 2.0]

[optimize]
pgd_steps = 10
step_size = 0.01         # η，每步步长
epsilon = 0.03           # L∞ 扰动上界

[scheduler]
pool_capacity = 256      # 种子池容量上限
retire_patience = 6      # 种子连续多少轮无收益即退役
w_coverage = 1.0         # 最近覆盖增量权重
w_novelty = 0.8          # 路径新颖权重
w_defect = 0.3           # 缺陷历史权重（含随机性，压低）
w_fuzz_penalty = 0.5     # 变异次数惩罚，抑制过度变异
w_cccov_gap = 1.0        # 类关键覆盖缺口权重，向覆盖不足的类倾斜

[loop]
max_iterations = 100     # 主循环最大轮数
seeds_per_round = 8      # 每轮调度选取的种子数
log_interval = 10        # 每多少轮打一条日志
cncov_target = 0.95      # CNCov 达此值即提前终止
growth_patience = 8      # 覆盖与缺陷增长连续多少轮双低即终止

[feedback]
enabled = true              # 动态反馈：逐轮按四指标调 λ2/λ3；关闭即静态权重基线
window = 10                 # 滑动窗口轮数
step_up = 1.15              # 触发时的乘法上调因子
step_down = 0.95            # 不触发时的乘法回落因子
cov_stall_eps = 0.005       # 窗口内 ΔCNCov 均值低于此判覆盖停滞
sem_shift_threshold = -1.0  # 语义偏移阈，<=0 表示自动取 1-γ_input
